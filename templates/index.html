<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CineAgent</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 font-sans h-screen flex flex-col items-center p-10">
    <div class="w-full max-w-2xl bg-slate-900 rounded-xl shadow-2xl overflow-hidden border border-slate-800 flex flex-col h-[600px]">
        
        <div class="bg-slate-950 p-4 border-b border-slate-800">
            <h1 class="text-xl font-bold text-red-500">🎬 CineAgent</h1>
            <p class="text-xs text-slate-400">Finds niche movies streaming for free</p>
        </div>
        
        <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="bg-slate-800 p-3 rounded-lg max-w-[80%]">What kind of mood are you in?</div>
        </div>

        <div class="p-4 bg-slate-950 border-t border-slate-800 flex gap-2">
            <input id="user-input" type="text" class="flex-1 bg-slate-800 text-white rounded-lg px-4 py-2 outline-none focus:ring-1 focus:ring-red-500" placeholder="Type a mood or movie title..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg font-bold transition">Send</button>
        </div>
    </div>

    <script>
        const sessionId = Math.random().toString(36).substring(7);

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            const message = input.value.trim();
            if (!message) return;

            chatBox.innerHTML += `<div class="bg-red-900/50 p-3 rounded-lg max-w-[80%] ml-auto text-right border border-red-900">${message}</div>`;
            input.value = '';
            
            const loadingId = 'loading-' + Date.now();
            chatBox.innerHTML += `<div id="${loadingId}" class="text-slate-500 text-sm italic">Agent is thinking...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, message: message })
                });
                const data = await res.json();
                
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `<div class="bg-slate-800 p-3 rounded-lg max-w-[80%] border border-slate-700 whitespace-pre-wrap">${data.response}</div>`;
            } catch (e) {
                document.getElementById(loadingId).innerText = "Error connecting to server.";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
